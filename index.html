<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1114">
<title>Operating Manual</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Manual"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
background:#0e1114;color:#e7ebef;padding-bottom:90px}
.wrap{max-width:660px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:#0e1114f2;backdrop-filter:blur(10px);
border-bottom:1px solid #232a31;padding:10px 0 8px}
h1{font-size:15px;margin:0 0 9px;letter-spacing:.02em;color:#9fb0bf;font-weight:600}
.ptr{display:flex;gap:8px}
.chip{flex:1;background:#161b21;border:1px solid #2a323b;border-radius:11px;padding:8px 10px}
.chip .lab{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#7d8b98}
.chip .val{font-size:14px;font-weight:650;margin:2px 0 6px;color:#fff;line-height:1.3}
.chip .btns{display:flex;gap:6px}
.chip button{flex:1;background:#232c35;color:#cfdae4;border:0;border-radius:7px;padding:6px;
font-size:13px;font-weight:600}
.chip button:active{background:#31404d}
nav{display:flex;gap:6px;margin:9px 0 0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:#161b21;color:#93a3b1;border:1px solid #2a323b;border-radius:999px;
padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap}
nav button.on{background:#3d7dd8;border-color:#3d7dd8;color:#fff}
.mods{display:flex;gap:6px;margin:10px 0 6px}
.mods button{flex:1;background:#161b21;color:#93a3b1;border:1px solid #2a323b;border-radius:9px;
padding:9px 4px;font-size:13px;font-weight:650}
.mods button.on{background:#1f6f4a;border-color:#1f6f4a;color:#fff}
.togs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.togs button{background:#161b21;color:#8794a1;border:1px solid #2a323b;border-radius:999px;
padding:6px 12px;font-size:12px;font-weight:600}
.togs button.on{background:#7a4a1c;border-color:#9a5f26;color:#fff}
.task{display:flex;gap:11px;padding:11px 2px;border-bottom:1px solid #1c232a;align-items:flex-start}
.task.done{opacity:.38}
.task.done .tx{text-decoration:line-through}
.box{flex:0 0 23px;height:23px;border:2px solid #3a4650;border-radius:6px;margin-top:1px}
.task.done .box{background:#1f6f4a;border-color:#1f6f4a;position:relative}
.task.done .box:after{content:"";position:absolute;left:7px;top:2px;width:5px;height:11px;
border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
.tm{flex:0 0 52px;font-size:12px;color:#6f8092;font-variant-numeric:tabular-nums;
padding-top:3px;font-weight:600}
.tb{flex:1;min-width:0}
.tx{font-size:14.5px;line-height:1.45}
.ids{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.ids span{font-size:10.5px;background:#1d242c;color:#7f93a5;padding:2px 7px;border-radius:5px;
font-weight:700;letter-spacing:.04em}
.ids span:active{background:#3d7dd8;color:#fff}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#6f8092;
margin:22px 0 4px;font-weight:700}
.note{background:#161b21;border:1px solid #2a323b;border-left:3px solid #9a5f26;
border-radius:9px;padding:11px 13px;margin:10px 0;font-size:13.5px;color:#b8c5d1}
table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
td,th{border:1px solid #2a323b;padding:6px 8px;text-align:left}
th{background:#171d24;color:#9fb0bf;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
td.n{color:#6f8092;width:34px;font-weight:700;font-variant-numeric:tabular-nums}
tr.cur td{background:#1b3a2c;color:#fff}
tr.rev td{color:#e0b062}
#q{width:100%;background:#161b21;border:1px solid #2a323b;color:#e7ebef;border-radius:10px;
padding:11px 13px;font-size:15px;margin:12px 0 4px}
.rcard{background:#161b21;border:1px solid #2a323b;border-radius:10px;padding:11px 13px;margin:7px 0}
.rcard b.id{color:#7fb3f5;font-size:12px;letter-spacing:.05em}
.rcard .rt{font-size:14px;font-weight:650;margin-top:2px}
.sheet{position:fixed;inset:0;background:#0e1114f0;z-index:60;overflow-y:auto;display:none;
padding:18px 14px 60px}
.sheet.on{display:block}
.sheet .in{max-width:660px;margin:0 auto;background:#141a20;border:1px solid #2a323b;
border-radius:14px;padding:16px 16px 20px}
.sheet h3{margin:0 0 2px;font-size:12px;color:#7fb3f5;letter-spacing:.06em}
.sheet h4{margin:0 0 12px;font-size:17px}
.sheet .bd{font-size:14px;line-height:1.6;color:#c6d2dd}
.sheet .bd p{margin:9px 0}
.sheet .bd em{color:#8fa0af}
.sheet .bd strong{color:#fff}
.sheet .bd table{font-size:12px}
.sheet .bd code{background:#1d242c;padding:1px 5px;border-radius:4px;font-size:12px}
.sheet .bd pre{background:#1d242c;padding:10px;border-radius:8px;overflow-x:auto;font-size:11.5px}
.cls{width:100%;margin-top:16px;background:#232c35;color:#cfdae4;border:0;border-radius:9px;
padding:13px;font-size:15px;font-weight:650}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0e1114f5;backdrop-filter:blur(10px);
border-top:1px solid #232a31;padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:30}
.bar .in{max-width:660px;margin:0 auto;display:flex;gap:8px;align-items:center}
.prog{flex:1;font-size:12.5px;color:#8794a1;font-weight:600}
.bar button{background:#232c35;color:#cfdae4;border:0;border-radius:8px;padding:9px 15px;
font-size:13px;font-weight:650}
.bar button.pri{background:#1f6f4a;color:#fff}
.hide{display:none}
body.locked header,body.locked .bar,body.locked .wrap{display:none}
.lock{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
padding:24px;background:#0e1114}
.lock.on{display:flex}
.lbox{width:100%;max-width:340px;text-align:center}
.licon{width:64px;height:64px;margin:0 auto 18px;border-radius:15px;background:#161b21;
border:1px solid #2a323b;display:flex;align-items:center;justify-content:center;font-size:28px}
.ltitle{font-size:19px;font-weight:700;color:#fff}
.lsub{font-size:13px;color:#7d8b98;margin:4px 0 22px}
#pw{width:100%;background:#161b21;border:1px solid #2a323b;color:#e7ebef;border-radius:11px;
padding:14px 15px;font-size:17px;text-align:center;letter-spacing:.06em}
#pw:focus{outline:none;border-color:#3d7dd8}
.lrem{display:flex;align-items:center;justify-content:center;gap:9px;margin:16px 0 18px;
font-size:13.5px;color:#93a3b1}
.lrem input{width:19px;height:19px;accent-color:#1f6f4a}
#unlock{width:100%;background:#3d7dd8;color:#fff;border:0;border-radius:11px;padding:15px;
font-size:16px;font-weight:650}
#unlock:disabled{background:#2a3a52;color:#7d8b98}
.lerr{margin-top:14px;font-size:13.5px;color:#ff9b9b;min-height:18px}
.lnote{margin-top:22px;font-size:11.5px;color:#5d6b78;line-height:1.55}

html{-webkit-text-size-adjust:100%}
.task,.ids span,.rcard,nav button,.mods button,.togs button,.chip button,.bar button,.cls,.box{
cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#err{display:none;background:#5a1d1d;border:1px solid #8c3030;color:#ffd9d9;padding:10px 13px;
border-radius:9px;margin:12px 0;font-size:13px;white-space:pre-wrap}
</style></head><body class="locked"><div class="lock" id="lock"><div class="lbox">
<div class="licon">&#128274;</div>
<div class="ltitle">Operating Manual</div>
<div class="lsub">Enter your passphrase</div>
<input id="pw" type="password" autocomplete="current-password" enterkeyhint="go" placeholder="passphrase">
<label class="lrem"><input type="checkbox" id="rem" checked> Remember on this device</label>
<button id="unlock">Unlock</button>
<div class="lerr" id="lerr"></div>
<div class="lnote">Everything in this page is encrypted. Without the passphrase there is nothing here to read.</div>
</div></div>
<header><div class="wrap"><h1>OPERATING MANUAL</h1>
<div class="ptr">
  <div class="chip"><div class="lab">Gym session</div><div class="val" id="gv">–</div>
    <div class="btns"><button id="gm">−</button><button id="gp">+</button></div></div>
  <div class="chip"><div class="lab">Study slot</div><div class="val" id="sv">–</div>
    <div class="btns"><button id="sm">−</button><button id="sp">+</button></div></div>
</div>
<nav><button data-tab="today" class="on">Today</button>
<button data-tab="seq">Sequences</button><button data-tab="rules">Rules</button></nav>
</div></header>
<div class="wrap"><div id="err"></div><div id="main"></div></div>
<div class="bar" id="bar"><div class="in"><div class="prog" id="prog"></div>
<button id="clr">Clear</button><button id="nxt" class="pri">Day done</button></div></div>
<div class="sheet" id="sheet"><div class="in">
<h3 id="sid"></h3><h4 id="sti"></h4><div class="bd" id="sbd"></div>
<button class="cls" id="cls">Close</button></div></div>
<script>
window.onerror=function(m,s,l){var e=document.getElementById('err');
  if(e){e.style.display='block';e.textContent='Error: '+m+'  (line '+l+')'}return false};
function boot(D){
const S=(()=>{let m={};try{localStorage.setItem('_t','1');localStorage.removeItem('_t');
return{g:k=>localStorage.getItem(k),s:(k,v)=>localStorage.setItem(k,v)}}catch(e){
return{g:k=>(k in m?m[k]:null),s:(k,v)=>{m[k]=v}}}})();
let st={g:+(S.g('g')||0),s:+(S.g('s')||0),m:S.g('m')||'A',
  tog:JSON.parse(S.g('tog')||'{}'),done:JSON.parse(S.g('done')||'{}'),tab:'today'};
const save=()=>{S.s('g',st.g);S.s('s',st.s);S.s('m',st.m);
  S.s('tog',JSON.stringify(st.tog));S.s('done',JSON.stringify(st.done))};
const $=id=>document.getElementById(id);

function list(){
  let L;
  if(st.m==='A')L=D.A.slice();
  else if(st.m==='B')L=D.B.slice();
  else{L=(st.tog.gym?D.A.filter(t=>t.time&&t.time<'09:30'):[]).concat(D.C);}
  if(st.tog.sat){const keep=L.filter(t=>t.time&&t.time>='16:00');L=D.V2.concat(keep);}
  return L;
}
function tasksHTML(){
  const L=list();
  return L.map((t,i)=>{const k=st.m+'|'+i+'|'+t.time+'|'+t.task.slice(0,18);
    const d=st.done[k]?' done':'';
    return `<div class="task${d}" data-k="${esc(k)}"><div class="box"></div>
      <div class="tm">${esc(t.time)}</div><div class="tb"><div class="tx">${md(t.task)}</div>
      <div class="ids">${t.r.map(r=>`<span data-r="${r}">${r}</span>`).join('')}</div></div></div>`;
  }).join('');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}

function today(){
  const notes=[];
  if(st.m==='C')notes.push('<div class="note"><b>Freedom day.</b> Mandatory: sleep, self-mastery, nutrition and supplements. Gym and study optional. Everything else is finished before the free block. Max 2 a week, never consecutive.</div>');
  if(D.gym[st.g]==='LEGS')notes.push('<div class="note"><b>Legs day.</b> Warm-up 10 min minimum. Heavier lunch: 40–60 g protein + 70–80 g carbs. Biggest dinner of the cycle. No antioxidant megadose within 4 h. Never downgrade this day.</div>');
  if(st.tog.wk)notes.push('<div class="note"><b>Weekly mastery block</b> replaces the standard hour today:<br>'+D.V3.map(t=>(t.time?t.time+' · ':'')+t.task.replace(/\*\*/g,'')).join('<br>')+'</div>');
  const L=list(),n=L.length;
  const dn=L.filter((t,i)=>st.done[st.m+'|'+i+'|'+t.time+'|'+t.task.slice(0,18)]).length;
  return `<div class="mods">
    <button data-m="A" class="${st.m==='A'?'on':''}">A · stay-in</button>
    <button data-m="B" class="${st.m==='B'?'on':''}">B · go-out</button>
    <button data-m="C" class="${st.m==='C'?'on':''}">C · freedom</button></div>
   <div class="togs">
    <button data-t="sat" class="${st.tog.sat?'on':''}">Saturday spine</button>
    <button data-t="wk" class="${st.tog.wk?'on':''}">Weekly mastery</button>
    ${st.m==='C'?`<button data-t="gym" class="${st.tog.gym?'on':''}">With gym</button>`:''}
   </div>${notes.join('')}${tasksHTML()}
   ${st.m==='C'?'<h2>Floors — wherever they land</h2>'+D.Cfloor.map(t=>
      `<div class="task"><div class="box"></div><div class="tm"></div><div class="tb">
      <div class="tx">${md(t.task)}</div><div class="ids">${t.r.map(r=>`<span data-r="${r}">${r}</span>`).join('')}</div>
      </div></div>`).join(''):''}`;
}
function seq(){
  const g=D.gym.map((s,i)=>`<tr class="${i===st.g?'cur':''}"><td class="n">${i+1}</td><td>${s}</td></tr>`).join('');
  const s=D.study.map((s,i)=>`<tr class="${i===st.s?'cur':(s[5]==='3'?'rev':'')}"><td class="n">${i+1}</td><td>${s}</td></tr>`).join('');
  return `<h2>Gym — 7 sessions</h2><table><tr><th>#</th><th>Session</th></tr>${g}</table>
   <h2>Study — 20 slots</h2><table><tr><th>#</th><th>Item</th></tr>${s}</table>
   <h2>Composition rules</h2><table>${D.rules.map(r=>`<tr><td>${esc(r)}</td></tr>`).join('')}</table>
   <div class="note">Both pointers advance only when the thing happens. A freedom day without gym delays a session, it never skips one. Items 5, 6 and 7 sit outside the sequence — Anki maintains them, and a freedom day's optional block takes one if needed.</div>`;
}
function rules(q){
  const k=Object.keys(D.cards).sort();
  const f=q?k.filter(id=>(id+' '+D.cards[id].t+' '+D.cards[id].h).toLowerCase().includes(q.toLowerCase())):k;
  return `<input id="q" placeholder="Search 126 rules — try zinc, Tier 1, casein…" value="${esc(q||'')}">
   <div style="font-size:12px;color:#6f8092;margin:6px 0 10px">${f.length} card${f.length===1?'':'s'}</div>
   ${f.map(id=>`<div class="rcard" data-r="${id}"><b class="id">${id}</b>
     <div class="rt">${esc(D.cards[id].t)}</div></div>`).join('')}`;
}
function render(){
  $('gv').textContent=(st.g+1)+' of 7 · '+D.gym[st.g];
  $('sv').textContent='#'+(st.s+1)+' · '+D.study[st.s];
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===st.tab));
  $('main').innerHTML = st.tab==='today'?today() : st.tab==='seq'?seq() : rules(st.q||'');
  const L=list(),n=L.length;
  const dn=L.filter((t,i)=>st.done[st.m+'|'+i+'|'+t.time+'|'+t.task.slice(0,18)]).length;
  $('prog').textContent = st.tab==='today'? `${dn} / ${n} done` : '';
  $('bar').classList.toggle('hide', st.tab!=='today');
  save();
}
document.body.addEventListener('click',e=>{
  const r=e.target.closest('[data-r]');
  if(r){const c=D.cards[r.dataset.r];if(c){$('sid').textContent=r.dataset.r;
    $('sti').textContent=c.t;$('sbd').innerHTML=c.h;$('sheet').classList.add('on');
    window.scrollTo(0,0);}return;}
  const t=e.target.closest('.task[data-k]');
  if(t){const k=t.dataset.k;st.done[k]=!st.done[k];t.classList.toggle('done');
    const L=list(),n=L.length;
    const dn=L.filter((x,i)=>st.done[st.m+'|'+i+'|'+x.time+'|'+x.task.slice(0,18)]).length;
    $('prog').textContent=`${dn} / ${n} done`;save();return;}
  const m=e.target.closest('[data-m]'); if(m){st.m=m.dataset.m;render();return;}
  const g=e.target.closest('[data-t]'); if(g){st.tog[g.dataset.t]=!st.tog[g.dataset.t];render();return;}
  const nb=e.target.closest('nav button'); if(nb){st.tab=nb.dataset.tab;render();return;}
});
$('gp').onclick=()=>{st.g=(st.g+1)%7;render()};
$('gm').onclick=()=>{st.g=(st.g+6)%7;render()};
$('sp').onclick=()=>{st.s=(st.s+1)%20;render()};
$('sm').onclick=()=>{st.s=(st.s+19)%20;render()};
$('clr').onclick=()=>{st.done={};render()};
let armed=0;
$('nxt').onclick=()=>{const b=$('nxt');
  if(!armed){armed=1;b.textContent='Tap again';b.style.background='#8c3030';
    setTimeout(()=>{if(armed){armed=0;b.textContent='Day done';b.style.background=''}},3000);return}
  armed=0;b.textContent='Day done';b.style.background='';st.done={};render()};
$('cls').onclick=()=>$('sheet').classList.remove('on');
document.body.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;
  const p=e.target.selectionStart;render();const q=$('q');if(q){q.focus();q.setSelectionRange(p,p)}}});

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=b=>btoa(String.fromCharCode.apply(null,new Uint8Array(b)));
const LS=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return localStorage}
catch(e){return null}})();
async function derive(pw,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:310000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function unwrap(key){
  const raw=b64d(ENC);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},key,raw.slice(28));
  return JSON.parse(new TextDecoder().decode(pt));
}
function launch(D){
  var l=document.getElementById('lock'); if(l)l.remove();
  document.body.classList.remove('locked');
  boot(D);
}
(async function(){
  if(!(window.crypto&&window.crypto.subtle)){
    document.getElementById('lock').classList.add('on');
    document.getElementById('unlock').disabled=true;
    document.getElementById('lerr').textContent=
      'This page must be opened over https:// — decryption is unavailable on plain http or from a local file.';
    return;
  }
  if(LS&&LS.getItem('k')){
    try{
      const key=await crypto.subtle.importKey('raw',b64d(LS.getItem('k')),'AES-GCM',true,['decrypt']);
      launch(await unwrap(key)); return;
    }catch(e){ LS.removeItem('k'); }
  }
  document.getElementById('lock').classList.add('on');
  setTimeout(function(){document.getElementById('pw').focus()},250);
})();
async function doUnlock(){
  const pw=document.getElementById('pw').value;
  if(!pw)return;
  const b=document.getElementById('unlock'), e=document.getElementById('lerr');
  b.disabled=true; b.textContent='Unlocking…'; e.textContent='';
  try{
    const key=await derive(pw,b64d(ENC).slice(0,16));
    const D=await unwrap(key);
    if(document.getElementById('rem').checked&&LS){
      LS.setItem('k',b64e(await crypto.subtle.exportKey('raw',key)));
    }
    launch(D);
  }catch(err){
    e.textContent='Wrong passphrase.';
    b.disabled=false; b.textContent='Unlock';
    document.getElementById('pw').value=''; document.getElementById('pw').focus();
  }
}
document.getElementById('unlock').onclick=doUnlock;
document.getElementById('pw').addEventListener('keydown',function(ev){
  if(ev.key==='Enter')doUnlock();});
</script>
